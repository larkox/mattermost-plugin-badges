version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  disable-all: true
  enable:
    - bodyclose
    - errcheck
    - gocritic
    - gofmt
    - goimports
    - gosec
    - gosimple
    - govet
    - ineffassign
    - misspell
    - nakedret
    - staticcheck
    - stylecheck
    - unconvert
    - unused
    - whitespace
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes: github.com/mattermost/mattermost-starter-template
    misspell:
      locale: US

issues:
  exclude-rules:
    - path: server/manifest.go
      linters:
        - unused
    - path: server/configuration.go
      linters:
        - unused
    - path: _test\.go
      linters:
        - bodyclose
